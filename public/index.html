<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de préstamos Rene | PrestamosRene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-b from-emerald-50 via-teal-50/40 to-slate-100 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100 antialiased">
<main class="max-w-2xl mx-auto px-3.5 sm:px-4 pt-4 pb-16">
  <section id="vista-lista">
    <header class="relative overflow-hidden mb-5 rounded-2xl sm:rounded-3xl bg-gradient-to-br from-emerald-600 via-emerald-700 to-teal-700 text-white p-4 sm:p-6 shadow-xl shadow-emerald-900/15">
      <div class="pointer-events-none absolute -right-10 -top-10 h-40 w-40 rounded-full bg-white/10 blur-2xl"></div>
      <div class="relative">
        <div class="flex items-center justify-between gap-2">
          <span class="inline-block rounded-full bg-white/15 px-2.5 py-0.5 text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider text-emerald-50 ring-1 ring-white/20">PrestamosRene</span>
          <button id="btn-nuevo" type="button" class="rounded-xl bg-white text-emerald-800 px-3 py-1.5 text-xs sm:text-sm font-bold shadow-sm hover:bg-emerald-50 active:scale-95 transition">+ Nuevo cliente</button>
        </div>
        <h1 class="mt-2.5 text-xl sm:text-3xl font-extrabold tracking-tight">Control de préstamos</h1>
        <p class="text-emerald-100/90 text-xs sm:text-sm mt-0.5">Clientes, intereses mensuales, capital y comprobantes.</p>
        <div class="grid grid-cols-3 gap-2 mt-4 text-center" id="resumen"></div>
      </div>
    </header>
    <div id="box-form" hidden class="rounded-2xl sm:rounded-3xl bg-white/95 dark:bg-slate-900/95 shadow-lg shadow-slate-200/60 dark:shadow-none p-4 sm:p-6 mb-5 ring-1 ring-slate-200/80 dark:ring-slate-800">
      <div class="flex items-center justify-between mb-3">
        <h2 id="t-form" class="font-bold text-lg">Nuevo cliente</h2>
        <button id="cerrar-form" type="button" class="text-xs font-semibold text-slate-500 hover:text-slate-700 dark:text-slate-400">Cerrar ✕</button>
      </div>
      <form id="form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="sm:col-span-2 text-xs font-medium text-slate-500 dark:text-slate-400">Nombre del cliente<input name="nombre" required class="inp"></label>
        <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Teléfono (con código país)<input name="telefono" type="tel" placeholder="Ej. 584121234567" class="inp"></label>
        <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Cédula / ID<input name="doc" class="inp"></label>
        <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Monto prestado (Bs.)<input name="monto" type="number" min="1" step="0.01" required class="inp"></label>
        <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Interés mensual (%)<input name="tasa" type="number" min="0" step="0.01" required class="inp"></label>
        <label class="sm:col-span-2 text-xs font-medium text-slate-500 dark:text-slate-400">Fecha del préstamo<input name="fecha" type="date" required class="inp"></label>
        <button id="guardarBtn" class="sm:col-span-2 btn-p">Guardar cliente</button>
        <button id="cancelar" type="button" hidden class="sm:col-span-2 btn-s">Cancelar edición</button>
      </form>
    </div>
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="font-bold text-base sm:text-lg">Clientes</h2>
      <span id="total-clientes" class="text-xs font-medium text-slate-500 dark:text-slate-400"></span>
    </div>
    <input id="buscar" type="search" placeholder="Buscar por nombre, teléfono o cédula..." class="inp mb-3 !mt-0 bg-white dark:bg-slate-900">
    <div id="lista" class="space-y-2.5 sm:space-y-3"></div>
  </section>

  <section id="vista-detalle" hidden>
    <button id="volver" type="button" class="mb-3 inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-semibold text-emerald-700 dark:text-emerald-300 bg-white/80 dark:bg-slate-900/80 ring-1 ring-slate-200 dark:ring-slate-800 hover:bg-emerald-50 dark:hover:bg-slate-800 active:scale-95 transition">← Volver</button>
    <div class="rounded-2xl sm:rounded-3xl bg-white/95 dark:bg-slate-900/95 shadow-lg shadow-slate-200/60 dark:shadow-none p-4 sm:p-6 mb-4 ring-1 ring-slate-200/80 dark:ring-slate-800">
      <div class="flex items-start justify-between gap-2">
        <h1 id="d-nombre" class="text-xl sm:text-2xl font-extrabold tracking-tight"></h1>
        <div class="flex gap-2.5 text-xs sm:text-sm font-semibold shrink-0"><button id="editar" type="button" class="text-emerald-700 dark:text-emerald-400 hover:underline">Editar</button><button id="borrar" type="button" class="text-rose-600 dark:text-rose-400 hover:underline">Eliminar</button></div>
      </div>
      <dl id="d-datos" class="grid grid-cols-2 gap-2.5 sm:gap-3.5 mt-3.5"></dl>
    </div>
    <div class="rounded-2xl sm:rounded-3xl bg-white/95 dark:bg-slate-900/95 shadow-lg shadow-slate-200/60 dark:shadow-none p-4 sm:p-6 mb-4 ring-1 ring-slate-200/80 dark:ring-slate-800">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div>
          <h2 class="font-bold text-base sm:text-lg">Pagos al capital</h2>
          <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">Registra abonos parciales o el pago total.</p>
        </div>
        <button id="btn-cap" type="button" class="btn-p text-xs sm:text-sm">Abonar capital</button>
      </div>
      <form id="form-cap" hidden class="mb-4 grid grid-cols-2 gap-2 items-end rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3 ring-1 ring-slate-200 dark:ring-slate-700">
        <label class="text-xs text-slate-500 dark:text-slate-400">Fecha del pago<input type="date" name="f" required class="inp"></label>
        <label class="text-xs text-slate-500 dark:text-slate-400">Monto a pagar<input type="number" name="m" step="0.01" min="0.01" required class="inp"></label>
        <button class="btn-p col-span-2">Guardar pago de capital</button>
      </form>
      <div id="capitales" class="space-y-2"></div>
    </div>
    <div class="rounded-2xl sm:rounded-3xl bg-white/95 dark:bg-slate-900/95 shadow-lg shadow-slate-200/60 dark:shadow-none p-4 sm:p-6 ring-1 ring-slate-200/80 dark:ring-slate-800">
      <h2 class="font-bold text-base sm:text-lg mb-0.5">Intereses mensuales</h2>
      <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mb-3">Puedes registrar un pago antes de su vencimiento (pago anticipado).</p>
      <div id="meses" class="space-y-2"></div>
      <button id="mas" type="button" class="mt-3 w-full btn-s text-sm">Mostrar más meses</button>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
